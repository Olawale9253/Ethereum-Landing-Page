<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="nft-card">
    <div class="image-wrapper">
      <img src="/images/image-equilibrium.jpg" alt="Colorful 3D cube artwork">
      <div class="image-overlay"><span class="view-icon">◉</span></div>
    </div>
    <h1>Equilibrium #3429</h1>
    <p class="description">Our Equilibrium collection promotes<br class="desktop-break"> balance and calm.</p>
    <div class="details">
      <span class="price"><span class="ethereum-symbol">♦</span> 0.041 ETH</span>
      <span class="time"><span class="clock">◷</span> 3 days left</span>
    </div>
    <div class="creator">
      <img src="/images/image-avatar.png" alt="Creator profile picture">
      <p>Creation of <strong>Jules Wyvern</strong></p>
    </div>
  </main>
</body>
</html>
